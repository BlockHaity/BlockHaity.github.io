name: Hexo Deploy

on:
  push:
    branches:
      - main # 触发条件，当 main 分支有 push 事件时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 运行环境

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取所有分支
          submodules: recursive # 拉取主题与 apps 子模块

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "24" # 选择 Node.js 版本

      - name: Install Dependencies
        run: npm install # 安装 Hexo 依赖

      - name: Build Apps
        run: bash apps/build.sh "$RUNNER_TEMP/apps-dist" # 先构建 apps/ 下的所有应用

      - name: Hexo Generate
        run: npm run build # 构建 Hexo 静态文件

      - name: Merge Apps into public
        run: |
          # 把应用产物放进 public/apps/，与 source/apps/index.html 生成的
          # 应用卡片入口页(/apps/)合并，点击卡片即可访问 /apps/<应用名>/
          mkdir -p public/apps
          cp -r "$RUNNER_TEMP/apps-dist/." public/apps/

      - name: Run Script
        run: python3 script.py # 运行 Python 脚本

      - name: Set Git information # 设置git信息
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Commit and Push
        run: |
          # 先把构建产物移出工作区。若留在 public/ 里，下面的 git switch -f 会用
          # gh-pages 分支上已跟踪的旧 public/ 副本覆盖掉刚生成的新产物，导致首页
          # 等所有已存在的路径永远停留在旧版本（曾经因此只新增了 /tags/、/categories/
          # 这些新路径，旧页面一个都没更新）。
          mv public "$RUNNER_TEMP/hexo-public"

          git switch -f -C gh-pages origin/gh-pages

          # 清空工作区（保留 .git）。这里不用 git rm：索引在上一步切换后已与工作区
          # 同步，直接 `git rm -rf --cached .` 会清空索引，使随后的 `git rm -rf .`
          # 报「路径规格 '.' 未匹配任何文件」并被 || true 吞掉，旧文件留在工作区，
          # 随后又被 git add -A 重新提交，垃圾（public/、db.json、node_modules/）
          # 只增不减。
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # 复制构建产物。用 /. 结尾以包含 .nojekyll 等隐藏文件，
          # `public/*` 这种 glob 会漏掉它们。
          cp -r "$RUNNER_TEMP/hexo-public/." .

          # 添加并提交
          git add -A
          git commit -m "Deploy to GitHub Pages" || echo "No changes to commit"

          # 强制推送
          git push --force origin gh-pages
