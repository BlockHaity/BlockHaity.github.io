name: Hexo Deploy

on:
  push:
    branches:
      - main # 触发条件，当 main 分支有 push 事件时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 运行环境

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取所有分支

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "24" # 选择 Node.js 版本

      - name: Install Dependencies
        run: npm install # 安装 Hexo 依赖

      - name: Install argon theme
        run: |
          git clone https://github.com/blockhaity/hexo-theme-argon.git themes/argon
      - name: Hexo Generate
        run: npm run build # 构建 Hexo 静态文件

      - name: Run Script
        run: python3 script.py # 运行 Python 脚本

      - name: Set Git information # 设置git信息
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Commit and Push
        run: |
          git switch -f -c gh-pages origin/gh-pages

          # 清空已跟踪文件，但排除 themes，避免 gitlink 报错
          git rm -rf --cached . 2>/dev/null || true
          git rm -rf . ':!themes' 2>/dev/null || true

          # 物理删除 themes，防止被 git add . 再次收录
          rm -rf themes

          # 复制构建产物
          cp -r public/* .

          # 添加并提交
          git add -A
          git commit -m "Deploy to GitHub Pages" || echo "No changes to commit"

          # 强制推送
          git push --force origin gh-pages
